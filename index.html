<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111e" />
  <meta name="description" content="QBiz - Hệ thống Bán hàng POS và Quản lý kho đa nền tảng cho Web, Android, iOS và PC." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QBiz Kho" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="./icons/logo-master.svg" />
  <link rel="stylesheet" href="./styles.css?v=20261008-v25-tax-reports" />
  <title>QBiz · Bán Hàng &amp; Quản Lý Kho</title>
  <script>
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__qbizInstallPrompt = e; });
  </script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Điều hướng chính">
      <div class="brand">
        <div class="brand-mark"><img src="./icons/logo-master.svg" alt="QBiz Logo" class="brand-logo-img" /></div>
        <div><strong>QBiz Kho</strong><span>Bán hàng &amp; Quản lý kho</span></div>
      </div>
      <nav id="desktopNav" class="nav-list"></nav>
      <div class="sidebar-foot">
        <div class="sync-pill" id="desktopSyncPill"><span class="dot"></span><span>Thiết bị này</span></div>
        <button class="ghost-btn full sidebar-install-btn" data-action="install-app"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> <span>Cài ứng dụng</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div style="min-width:0;flex:1 1 auto;overflow:hidden">
          <div class="eyebrow" id="pageEyebrow">QBiz</div>
          <h1 id="pageTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Tổng quan</h1>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>

      <section id="content" class="content"></section>
    </main>

    <nav id="mobileNav" class="mobile-nav" aria-label="Điều hướng mobile"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <div id="qbizPrintRoot" class="qbiz-print-only" aria-hidden="true"></div>

  <script src="./vendor/qr-code-styling.js"></script>
  <script>
    if (!window.QRCodeStyling) {
      document.write('<script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"><\/script>');
    }
  </script>
  <script type="module" src="./src/app.js?v=20261008-v25-tax-reports"></script>
</body>
</html>
